# Supporting prod images: same binaries, startup modes and health endpoints as Compose.
# HTTP probes call the existing endpoint directly, without spawning a healthcheck
# process in the container. STUN retains its protocol-level exec probe.
{{- range $name, $service := .Values.supportServices }}
{{- if hasKey $.Values.images $name }}
{{- if $service.storage }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  labels: {app.kubernetes.io/part-of: {{ $.Release.Namespace }}, app.kubernetes.io/name: {{ $name }}}
  annotations: {helm.sh/resource-policy: keep}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: {{ $service.storage }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {app.kubernetes.io/part-of: {{ $.Release.Namespace }}, app.kubernetes.io/name: {{ $name }}}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: {{ $.Release.Namespace }}, app.kubernetes.io/name: {{ $name }}}
      annotations:
        checksum/config: {{ printf "%s%s" (toJson $service) $.Values.publicBaseUrl | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      {{- if eq $name "registry" }}
      # Kubernetes fsGroup may add group-read permissions on volume mounts.
      # Restore the existing key's owner-only mode before the canonical binary
      # validates it. This does not create, replace or read the private key.
      initContainers:
      - name: registry-key-permissions
        image: {{ index $.Values.images "mongodb" "reference" | quote }}
        imagePullPolicy: {{ $.Values.imagePullPolicy }}
        command: [/bin/sh, -ec]
        args:
        - 'for key in /data/registry-demo-signing-key.pem /data/registry-global-identity-voprf-keyring.json; do test ! -L "$key"; if test -e "$key"; then test -f "$key"; chmod 0600 "$key"; fi; done'
        resources:
          requests: {cpu: 10m, memory: 8Mi, ephemeral-storage: 16Mi}
          limits: {cpu: 100m, memory: 32Mi, ephemeral-storage: 128Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts:
        - {name: data, mountPath: /data}
      {{- end }}
      containers:
      - name: {{ $name }}
        image: {{ index $.Values.images $name "reference" | quote }}
        imagePullPolicy: {{ $.Values.imagePullPolicy }}
        {{- if $service.command }}
        command: {{ toJson $service.command }}
        {{- end }}
        {{- if $service.args }}
        args: {{ toJson $service.args }}
        {{- end }}
        resources:
          requests: {cpu: 25m, memory: 16Mi, ephemeral-storage: 16Mi}
          limits:
            cpu: 500m
            memory: {{ $service.memoryMiB }}Mi
            ephemeral-storage: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        {{- if $service.secret }}
        envFrom:
        - secretRef: {name: {{ $service.secret }}}
        {{- end }}
        env:
        - {name: GOMEMLIMIT, value: 96MiB}
        {{- range $key, $value := $service.environment }}
        - {name: {{ $key }}, value: {{ $value | quote }}}
        {{- end }}
        {{- if eq $name "mcp" }}
        - {name: MYSCOUTEE_PUBLIC_API_BASE_URL, value: {{ printf "%s/api" $.Values.publicBaseUrl | quote }}}
        {{- else if eq $name "payment-simulator" }}
        - {name: PAYMENT_SIMULATOR_PUBLIC_BASE_URL, value: {{ $.Values.publicBaseUrl | quote }}}
        {{- end }}
        ports:
        - {name: service, containerPort: {{ $service.port }}, protocol: TCP}
        {{- if eq $name "stun" }}
        - {name: stun-udp, containerPort: 3478, protocol: UDP}
        {{- end }}
        startupProbe:
          {{- if $service.healthPath }}
          httpGet: {path: {{ $service.healthPath | quote }}, port: service, scheme: {{ $service.healthScheme | default "HTTP" }}}
          {{- else }}
          exec: {command: {{ toJson $service.healthCommand }}}
          {{- end }}
          periodSeconds: 2
          failureThreshold: 45
        readinessProbe:
          {{- if $service.healthPath }}
          httpGet: {path: {{ $service.healthPath | quote }}, port: service, scheme: {{ $service.healthScheme | default "HTTP" }}}
          {{- else }}
          exec: {command: {{ toJson $service.healthCommand }}}
          {{- end }}
          periodSeconds: 10
        livenessProbe:
          {{- if $service.healthPath }}
          httpGet: {path: {{ $service.healthPath | quote }}, port: service, scheme: {{ $service.healthScheme | default "HTTP" }}}
          {{- else }}
          exec: {command: {{ toJson $service.healthCommand }}}
          {{- end }}
          periodSeconds: 30
        volumeMounts:
        - {name: tmp, mountPath: /tmp}
        {{- if $service.storage }}
        - {name: data, mountPath: /data}
        {{- end }}
        {{- if eq $name "stun" }}
        - {name: coturn, mountPath: /var/lib/coturn}
        {{- end }}
      volumes:
      - name: tmp
        emptyDir: {sizeLimit: 16Mi}
      {{- if $service.storage }}
      - name: data
        persistentVolumeClaim: {claimName: {{ $name }}}
      {{- end }}
      {{- if eq $name "stun" }}
      - name: coturn
        emptyDir: {sizeLimit: 16Mi}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {app.kubernetes.io/part-of: {{ $.Release.Namespace }}, app.kubernetes.io/name: {{ $name }}}
spec:
  selector: {app.kubernetes.io/name: {{ $name }}}
  type: {{ if eq $name "stun" }}NodePort{{ else }}ClusterIP{{ end }}
  ports:
  - name: service
    port: {{ $service.port }}
    targetPort: service
    protocol: TCP
    {{- if eq $name "stun" }}
    nodePort: {{ $.Values.stunNodePort }}
  - name: stun-udp
    port: 3478
    targetPort: stun-udp
    protocol: UDP
    nodePort: {{ $.Values.stunNodePort }}
    {{- end }}
{{- end }}
{{- end }}
{{- range $name, $assembly := .Values.services }}
{{- if and (has "registry" $assembly.domains) (gt (int $assembly.replicas) 0) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-client
  labels: {app.kubernetes.io/part-of: {{ $.Release.Namespace }}}
  annotations: {helm.sh/resource-policy: keep}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: {storage: 128Mi}
{{- end }}
{{- end }}
