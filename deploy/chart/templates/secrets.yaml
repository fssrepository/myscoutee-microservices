apiVersion: v1
kind: Secret
metadata:
  name: deployment-configuration
  labels: {app.kubernetes.io/part-of: {{ $.Release.Namespace }}}
type: Opaque
stringData:
  deployment-master-key: {{ .Values.credentials.configurationMasterKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: runtime
  labels: {app.kubernetes.io/part-of: {{ $.Release.Namespace }}}
type: Opaque
stringData:
  MYSCOUTEE_DELEGATION_PUBLIC_KEY: {{ .Values.credentials.delegationPublicKey | quote }}
  MEDIA_OBJECT_STORE_ACCESS_KEY: lab-media
  MEDIA_OBJECT_STORE_SECRET_KEY: {{ .Values.credentials.minioRootPassword | quote }}
  {{- if hasKey .Values.images "payment-simulator" }}
  PAYMENT_SIMULATOR_API_KEY: {{ .Values.credentials.paymentSimulatorApiKey | quote }}
  PAYMENT_SIMULATOR_WEBHOOK_SECRET: {{ .Values.credentials.paymentSimulatorWebhookSecret | quote }}
  PAYMENT_STRIPE_API_KEY: {{ .Values.credentials.paymentSimulatorApiKey | quote }}
  PAYMENT_STRIPE_WEBHOOK_SECRET: {{ .Values.credentials.paymentSimulatorWebhookSecret | quote }}
  PAYMENT_BARION_API_KEY: {{ .Values.credentials.paymentSimulatorPosKey | quote }}
  {{- end }}
  {{- $hosts := "mongodb:27017" }}
  {{- $replica := "" }}
  {{- if .Values.mongodb.replicaSet }}
  {{- $hosts = "mongodb:27017,mongodb-secondary:27017" }}
  {{- $replica = printf "&replicaSet=%s&readPreference=primary&w=majority" .Values.databases.replicaSet }}
  {{- end }}
  SPRING_MONGODB_URI: {{ printf "mongodb://lab:%s@%s/%s?authSource=%s&maxPoolSize=12&minPoolSize=0%s" .Values.credentials.mongoPassword $hosts .Values.databases.real .Values.databases.real $replica | quote }}
  MONGODB_DEMO_URI: {{ printf "mongodb://lab:%s@%s/%s?authSource=%s&maxPoolSize=12&minPoolSize=0%s" .Values.credentials.mongoPassword $hosts .Values.databases.demo .Values.databases.demo $replica | quote }}
{{- if .Values.mongodb.replicaSet }}
---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-replica-key
  labels: {app.kubernetes.io/part-of: {{ $.Release.Namespace }}}
type: Opaque
stringData:
  keyfile: {{ .Values.credentials.mongoReplicaKey | quote }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-bootstrap
  labels: {app.kubernetes.io/part-of: {{ $.Release.Namespace }}}
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: root
  MONGO_INITDB_ROOT_PASSWORD: {{ .Values.credentials.mongoRootPassword | quote }}
  MONGO_APP_USERNAME: lab
  MONGO_APP_PASSWORD: {{ .Values.credentials.mongoPassword | quote }}
  MONGO_REAL_DATABASE: {{ .Values.databases.real | quote }}
  MONGO_DEMO_DATABASE: {{ .Values.databases.demo | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-bootstrap
  labels: {app.kubernetes.io/part-of: {{ $.Release.Namespace }}}
type: Opaque
stringData:
  MINIO_ROOT_USER: lab-media
  MINIO_ROOT_PASSWORD: {{ .Values.credentials.minioRootPassword | quote }}
{{- if hasKey .Values.images "payment-simulator" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: payment-simulator
  labels: {app.kubernetes.io/part-of: {{ $.Release.Namespace }}}
type: Opaque
stringData:
  PAYMENT_SIMULATOR_API_KEY: {{ .Values.credentials.paymentSimulatorApiKey | quote }}
  PAYMENT_SIMULATOR_WEBHOOK_SECRET: {{ .Values.credentials.paymentSimulatorWebhookSecret | quote }}
  PAYMENT_SIMULATOR_BARION_POS_KEY: {{ .Values.credentials.paymentSimulatorPosKey | quote }}
  PAYMENT_SIMULATOR_AUDIT_TOKEN: {{ .Values.credentials.paymentSimulatorAuditToken | quote }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: actor-delegation-issuer
  labels: {app.kubernetes.io/part-of: {{ $.Release.Namespace }}}
type: Opaque
stringData:
  MYSCOUTEE_DELEGATION_PRIVATE_KEY: {{ .Values.credentials.delegationPrivateKey | quote }}
  MYSCOUTEE_DELEGATION_CLIENTS_JSON: {{ .Values.actorDelegation.clients | toJson | quote }}
{{- range $name, $service := .Values.services }}
---
apiVersion: v1
kind: Secret
metadata:
  name: transport-{{ $name }}
  labels: {app.kubernetes.io/part-of: {{ $.Release.Namespace }}}
type: Opaque
data:
{{- if not (has "accounts" $service.domains) }}
  MYSCOUTEE_DELEGATION_CLIENT_TOKEN: {{ index $.Values.credentials (printf "delegationClient-%s" $name) | b64enc | quote }}
{{- end }}
{{- range $environment, $credential := index $.Values.transportCredentialsByService $name }}
  {{ $environment }}: {{ index $.Values.credentials $credential | b64enc | quote }}
{{- end }}
{{- end }}
