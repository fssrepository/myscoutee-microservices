{{- if not .Values.mongodb.replicaSet }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: {{ $.Release.Namespace }}
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/managed-by: Helm
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: {{ $.Values.mongodb.storage }}
{{- end }}
---
apiVersion: apps/v1
kind: {{ ternary "StatefulSet" "Deployment" .Values.mongodb.replicaSet }}
metadata:
  name: mongodb
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: {{ $.Release.Namespace }}
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/managed-by: Helm
spec:
  {{- if .Values.mongodb.replicaSet }}
  serviceName: mongodb-members
  replicas: 2
  podManagementPolicy: Parallel
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  updateStrategy:
    type: RollingUpdate
  {{- else }}
  replicas: 1
  strategy:
    type: Recreate
  {{- end }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: {{ $.Release.Namespace }}
        app.kubernetes.io/name: mongodb
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      {{- if $.Values.mongodb.replicaSet }}
      initContainers:
      - name: replica-key
        image: {{ $.Values.images.mongodb.reference | quote }}
        imagePullPolicy: {{ $.Values.imagePullPolicy }}
        command: [/bin/sh, -ec]
        args:
        - |
          cp /secret/keyfile /key/keyfile
          chown 999:999 /key/keyfile
          chmod 0400 /key/keyfile
          case "$HOSTNAME" in
            mongodb-0) MEMBER_HOST="mongodb.$NAMESPACE.svc.cluster.local" ;;
            mongodb-1) MEMBER_HOST="mongodb-secondary.$NAMESPACE.svc.cluster.local" ;;
            *) exit 1 ;;
          esac
          export MEMBER_HOST
          # Mongo validates its stored member address before listening. Resolve
          # our headless member name to this pod before that validation begins.
          timeout 60 sh -ec 'until getent ahostsv4 "$MEMBER_HOST" | awk "{print \$1}" | grep -Fxq "$POD_IP"; do sleep 1; done'
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef: {fieldPath: metadata.namespace}
        - name: POD_IP
          valueFrom:
            fieldRef: {fieldPath: status.podIP}
        resources:
          requests: {cpu: 10m, memory: 8Mi}
          limits: {cpu: 100m, memory: 32Mi}
        volumeMounts:
        - {name: replica-secret, mountPath: /secret, readOnly: true}
        - {name: replica-key, mountPath: /key}
      {{- end }}
      containers:
      - name: mongodb
        image: {{ $.Values.images.mongodb.reference | quote }}
        imagePullPolicy: {{ $.Values.imagePullPolicy }}
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
            ephemeral-storage: 16Mi
          limits:
            cpu: {{ $.Values.mongodb.cpuLimit | quote }}
            memory: {{ $.Values.mongodb.memoryMiB }}Mi
            ephemeral-storage: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
        {{- if .Values.mongodb.replicaSet }}
        command: [/bin/sh, -ec]
        {{- end }}
        args:
        {{- if .Values.mongodb.replicaSet }}
        - |
          case "$HOSTNAME" in
            mongodb-0) exec docker-entrypoint.sh mongod "$@" ;;
            mongodb-1) exec gosu mongodb mongod "$@" ;;
            *) exit 1 ;;
          esac
        - --
        {{- end }}
        - --bind_ip_all
        - --wiredTigerCacheSizeGB
        - '0.25'
        {{- if $.Values.mongodb.replicaSet }}
        - --replSet
        - {{ $.Values.databases.replicaSet | quote }}
        - --keyFile
        - /key/keyfile
        - --oplogSize
        - '256'
        {{- end }}
        envFrom:
        - secretRef:
            name: mongodb-bootstrap
        volumeMounts:
        {{- if $.Values.mongodb.replicaSet }}
        - {name: replica-key, mountPath: /key, readOnly: true}
        {{- end }}
        - name: data
          mountPath: /data/db
        - name: init
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        readinessProbe:
          tcpSocket:
            port: 27017
          periodSeconds: 5
      volumes:
      {{- if $.Values.mongodb.replicaSet }}
      - name: replica-secret
        secret: {secretName: mongodb-replica-key, defaultMode: 256}
      - name: replica-key
        emptyDir: {}
      {{- end }}
      {{- if not .Values.mongodb.replicaSet }}
      - name: data
        persistentVolumeClaim:
          claimName: mongodb
      {{- end }}
      - name: init
        configMap:
          name: mongodb-init
  {{- if .Values.mongodb.replicaSet }}
  volumeClaimTemplates:
  - metadata:
      name: data
      labels:
        app.kubernetes.io/part-of: {{ $.Release.Namespace }}
        app.kubernetes.io/name: mongodb
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: local-path
      resources:
        requests:
          storage: {{ .Values.mongodb.storage }}
  {{- end }}
{{- if .Values.mongodb.replicaSet }}
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-members
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: {{ $.Release.Namespace }}
    app.kubernetes.io/name: mongodb
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: mongodb
  ports:
  - {name: service, port: 27017, targetPort: 27017}
{{- end }}
{{- $members := list "mongodb" }}
{{- if .Values.mongodb.replicaSet }}{{ $members = append $members "mongodb-secondary" }}{{ end }}
{{- range $index, $name := $members }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: {{ $.Release.Namespace }}
    app.kubernetes.io/name: {{ $name }}
spec:
  {{- if $.Values.mongodb.replicaSet }}
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    statefulset.kubernetes.io/pod-name: mongodb-{{ $index }}
  {{- else }}
  selector:
    app.kubernetes.io/name: mongodb
  {{- end }}
  ports:
  - {name: service, port: 27017, targetPort: 27017}
{{- end }}
