---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: {{ $.Release.Namespace }}
    app.kubernetes.io/name: redis
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: {{ $.Release.Namespace }}
        app.kubernetes.io/name: redis
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: redis
        image: {{ .Values.images.redis.reference | quote }}
        imagePullPolicy: {{ $.Values.imagePullPolicy }}
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
            ephemeral-storage: 16Mi
          limits:
            cpu: '2'
            memory: {{ .Values.redis.memoryMiB }}Mi
            ephemeral-storage: 128Mi
        securityContext:
          runAsUser: 999
          runAsGroup: 999
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        command:
        - redis-server
        - --maxmemory
        - 64mb
        - --maxmemory-policy
        - allkeys-lru
        - --save
        - ''
        - --appendonly
        - 'no'
        readinessProbe:
          tcpSocket:
            port: 6379
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: {{ $.Release.Namespace }}
    app.kubernetes.io/name: redis
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    app.kubernetes.io/name: redis
  type: ClusterIP
  ports:
  - name: service
    port: 6379
    targetPort: 6379
